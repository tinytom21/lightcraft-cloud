[package]
name = "lightcraft-cloud-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client of a LightCraft cloud library (the rclone remote `lc-cloud` publishes): thumbnails, smart previews, edits back. App-agnostic: any app plugs its engine in."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# rclone's librclone, loaded at run time (ISC)
libloading = { workspace = true }
# LightCraft's content hash, streamed (the same algorithm and key as the engine's; a test compares them)
siphasher = { workspace = true }
# Pairing (pure Rust, no C: builds for Android): ChaCha20-Poly1305, Argon2id, deflate (miniz_oxide), the OS random source, zeroizing
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# free disk space before an imported photo is written
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
# free disk space (GetDiskFreeSpaceExW) and a move that cannot replace (MoveFileExW)
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# The phone fork's engine (it has `library.addRemote`, which upstream v0.15.0 to v0.17.0 lack), pinned to its v0.1.0 tag. The desktop app keeps
# the upstream engine; the two never meet in one crate. The fork depends on this crate, a dev-only cycle through git.
lightcraft-engine = { git = "https://github.com/tinytom21/lightcraft-android", rev = "dd8af9a5d7115247b7e8d213bc08c070f7da7bd4" }
lightcraft-scenes = { git = "https://github.com/tinytom21/lightcraft-android", rev = "dd8af9a5d7115247b7e8d213bc08c070f7da7bd4" }
lightcraft-meta = { git = "https://github.com/tinytom21/lightcraft-android", rev = "dd8af9a5d7115247b7e8d213bc08c070f7da7bd4" }
# (only the size test: what QR version the pairing text needs)
qrcode = { version = "0.14", default-features = false }
