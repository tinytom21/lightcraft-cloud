[package]
name = "lightcraft-cloud-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client of a LightCraft cloud library (the rclone remote `lc-cloud` publishes): thumbnails, smart previews, edits back. App-agnostic: any app plugs its engine in."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# rclone's librclone, loaded at run time (ISC)
libloading = { workspace = true }

[dev-dependencies]
# The phone fork's engine (it has `library.addRemote`, which upstream v0.15.0 lacks), pinned to its v0.1.0 tag. The desktop app keeps
# the upstream engine; the two never meet in one crate. The fork depends on this crate, a dev-only cycle through git.
lightcraft-engine = { git = "https://github.com/tinytom21/lightcraft-android", rev = "dd8af9a5d7115247b7e8d213bc08c070f7da7bd4" }
lightcraft-scenes = { git = "https://github.com/tinytom21/lightcraft-android", rev = "dd8af9a5d7115247b7e8d213bc08c070f7da7bd4" }
lightcraft-meta = { git = "https://github.com/tinytom21/lightcraft-android", rev = "dd8af9a5d7115247b7e8d213bc08c070f7da7bd4" }
