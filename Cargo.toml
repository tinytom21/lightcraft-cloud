[workspace]
resolver = "3"
members = ["crates/sync", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/tinytom21/lightcraft-cloud"

[workspace.dependencies]
lightcraft-cloud-client = { path = "crates/sync" }

thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# rclone's librclone, loaded at run time (ISC)
libloading = "0.8"
# LightCraft's content hash (SipHash-1-3, 128 bit), computed from a stream; free space of a folder (statvfs, no unsafe)
siphasher = "1"
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

# LightCraft's engine (pinned release; no `sam` or `denoise` features: rendering only). The desktop app renders thumbnails and
# smart previews with it (the sync crate's tests use the phone fork's engine instead, see its Cargo.toml). The other crates are for generating test photos.
lightcraft-engine = { git = "https://github.com/storytold/lightcraft", tag = "v0.15.0" }
lightcraft-scenes = { git = "https://github.com/storytold/lightcraft", tag = "v0.15.0" }
lightcraft-mcp = { git = "https://github.com/storytold/lightcraft", tag = "v0.15.0" }
lightcraft-meta = { git = "https://github.com/storytold/lightcraft", tag = "v0.15.0" }
lightcraft-raw = { git = "https://github.com/storytold/lightcraft", tag = "v0.15.0" }
lightcraft-color = { git = "https://github.com/storytold/lightcraft", tag = "v0.15.0" }
lightcraft-codecs = { git = "https://github.com/storytold/lightcraft", tag = "v0.15.0" }
lightcraft-raster = { git = "https://github.com/storytold/lightcraft", tag = "v0.15.0" }

toml = "1"

# The desktop app: folder watching, desktop notifications (pure Rust over D-Bus), the tray icon (its `ksni` backend: no GTK, no
# libappindicator, a StatusNotifierItem over D-Bus), and the egui windows at the version LightCraft v0.15.0 uses.
notify = "8"
notify-rust = "4"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }
raw-window-handle = "0.6"
egui_kittest = "0.37"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"
