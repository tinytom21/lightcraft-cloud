[package]
name = "lightcraft-cloud-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft Cloud for the PC: publishes a photo folder to the cloud library and applies the phone's edits (a tray app; the command line too)."

[lints]
workspace = true

[features]
# `home` (on by default) is the home PC's half: publishing needs LightCraft's engine, which renders the thumbnails and smart previews.
# `--no-default-features` is the light build for another PC: no engine, no publishing, the same app otherwise (Setup, tray, Status).
default = ["home"]
home = [
    "dep:lightcraft-engine",
    "dep:lightcraft-mcp",
    # (the generated-photo fixture: the `fixture` example and the engine test; nothing of these is linked into the app)
    "dep:lightcraft-scenes",
    "dep:lightcraft-meta",
    "dep:lightcraft-raw",
    "dep:lightcraft-color",
    "dep:lightcraft-codecs",
    "dep:lightcraft-raster",
]

[dependencies]
lightcraft-cloud-client = { workspace = true }
# Rendering only: the engine makes the thumbnails and smart previews. No `sam`, no `denoise`.
lightcraft-engine = { workspace = true, optional = true }
# (its `Headless` backend is the engine's own `app.export`, the one `lightcraft-cli` runs)
lightcraft-mcp = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
notify = { workspace = true }
notify-rust = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
rfd = { workspace = true }
raw-window-handle = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }

# Only the `fixture` example and tests/engine.rs use these (see the `home` feature).
lightcraft-scenes = { workspace = true, optional = true }
lightcraft-meta = { workspace = true, optional = true }
lightcraft-raw = { workspace = true, optional = true }
lightcraft-color = { workspace = true, optional = true }
lightcraft-codecs = { workspace = true, optional = true }
lightcraft-raster = { workspace = true, optional = true }

[dev-dependencies]
egui_kittest = { workspace = true }

[[example]]
name = "fixture"
required-features = ["home"]

[[test]]
name = "engine"
required-features = ["home"]

[[test]]
name = "app"
required-features = ["home"]

# The tray icon's Linux backend is a StatusNotifierItem over D-Bus (`ksni`); the other systems use tray-icon's own.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# Windows: the tray's message pump, the console of a command-line run, the per-user Run key (see `winsys`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

# The exe's icon (assets/icon.ico, made by `examples/make_icon.rs`).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
