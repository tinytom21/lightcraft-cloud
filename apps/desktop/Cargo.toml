[package]
name = "lightcraft-cloud-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft Cloud for the PC: publishes a photo folder to the cloud library and applies the phone's edits (a tray app; the command line too)."

[lints]
workspace = true

[dependencies]
lightcraft-cloud-client = { workspace = true }
# Rendering only: the engine makes the thumbnails and smart previews. No `sam`, no `denoise`.
lightcraft-engine = { workspace = true }
# (its `Headless` backend is the engine's own `app.export`, the one `lightcraft-cli` runs)
lightcraft-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
notify = { workspace = true }
notify-rust = { workspace = true }
tray-icon = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
rfd = { workspace = true }
raw-window-handle = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raw = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
sha2 = { workspace = true }
