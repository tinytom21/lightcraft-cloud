name: release

# Builds everything a release has: the two Windows installers (the other-PC edition, and the home PC edition with the LightCraft engine), the
# two Linux archives and SHA256SUMS.
#   * a tag `v*`: builds, checks, and creates a DRAFT GitHub release with the files and generated notes. Nothing is ever published by
#     this workflow: the draft is published by hand (the in-app updater only sees published releases);
#   * `workflow_dispatch`: the same build and the same checks, no release at all.
# The only secret used is the automatic GITHUB_TOKEN, and only in the last job, only on a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  librclone:
    uses: ./.github/workflows/librclone.yml

  windows-exe:
    # the program of each edition: the light one (another PC) and the home one (the default features, with the engine)
    name: Windows program (${{ matrix.variant }})
    needs: librclone
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: light, cargo_flags: "--no-default-features" }
          - { variant: home, cargo_flags: "" }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Version (and, on a tag, that the tag is it)
        id: ver
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v$version (the version in Cargo.toml)"; exit 1
          fi
      - name: Rust toolchain (the version rust-toolchain.toml pins)
        shell: bash
        run: |
          rustup toolchain install "$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)" --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows-release-${{ matrix.variant }}
      - name: Build (release, the ${{ matrix.variant }} edition; .cargo/config.toml makes the C runtime part of the exe)
        run: cargo build --release --locked -p lightcraft-cloud-desktop ${{ matrix.cargo_flags }}
      - name: Smoke test of the exe
        shell: pwsh
        run: |
          $exe = ".\target\release\lightcraft-cloud-desktop.exe"
          $v = & $exe --version | Out-String
          Write-Output $v
          if ($v -notmatch "lightcraft-cloud-desktop ${{ steps.ver.outputs.version }}") { throw "wrong version output" }
          if ($v -notmatch "edition: ${{ matrix.variant }}") { throw "this is not the ${{ matrix.variant }} edition" }
          $h = & $exe --help | Out-String
          if ($h -notmatch 'USAGE') { throw "no help output" }
          # the subsystem must be GUI (2), so the tray app opens no console window
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $sub = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          Write-Output "PE subsystem: $sub"
          if ($sub -ne 2) { throw "the exe is not a windows-subsystem program" }
          "exe: $((Get-Item $exe).Length) bytes"
      - name: The exe needs nothing but system DLLs (no Visual C++ runtime, no vcruntime)
        shell: pwsh
        run: python tools/ci/pe_imports.py target/release/lightcraft-cloud-desktop.exe
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: exe-windows-${{ matrix.variant }}
          path: target/release/lightcraft-cloud-desktop.exe
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installers
    needs: [librclone, windows-exe]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: ver
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: librclone-windows
          path: out
      - uses: actions/download-artifact@v8.0.2
        with:
          name: exe-windows-light
          path: exe-light
      - uses: actions/download-artifact@v8.0.2
        with:
          name: exe-windows-home
          path: exe-home
      - name: Inno Setup (the image's, else a pinned version)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # (the windows-latest image ships Inno Setup; if it ever stops, this version is installed instead)
            choco install innosetup --version 6.6.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco failed: $LASTEXITCODE" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $k = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          $ver = (Get-ItemProperty $k -ErrorAction SilentlyContinue).DisplayVersion
          Write-Output "Inno Setup $(if ($ver) { $ver } else { '(version not in the registry)' }) at $iscc"
          # (the script needs 6.3 or newer: ArchitecturesAllowed=x64compatible; an older compiler would also refuse it, loudly)
          if ($ver) {
            $parts = $ver.Split('.')
            if ([int]$parts[0] -ne 6 -or [int]$parts[1] -lt 3) { throw "Inno Setup $ver is not 6.3 or newer" }
          }
          "ISCC=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build the two installers (one script, /DHome for the home edition)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($v in 'light', 'home') {
            $d = "stage-$v"
            New-Item -ItemType Directory $d | Out-Null
            Copy-Item "exe-$v\lightcraft-cloud-desktop.exe", out\librclone.dll, out\LICENSE-rclone.txt $d
            Copy-Item LICENSE-MIT "$d\LICENSE-MIT.txt"
            Copy-Item LICENSE-APACHE "$d\LICENSE-APACHE.txt"
            Copy-Item apps\desktop\assets\fonts\OFL-Inter.txt "$d\LICENSE-Inter-OFL.txt"
            Copy-Item $(if ($v -eq 'home') { 'packaging\windows\README-home.txt' } else { 'packaging\windows\README.txt' }) "$d\README.txt"
            $iscArgs = @("/DAppVersion=${{ steps.ver.outputs.version }}", "/DStage=$((Resolve-Path $d).Path)", "/DOutDir=$((Resolve-Path dist).Path)")
            if ($v -eq 'home') { $iscArgs += '/DHome' }
            & $env:ISCC @iscArgs packaging\windows\lightcraft-cloud.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC ($v) failed: $LASTEXITCODE" }
          }
          Get-ChildItem dist | Format-Table Name, Length
          foreach ($n in "lightcraft-cloud-${{ steps.ver.outputs.version }}-windows-setup.exe", "lightcraft-cloud-${{ steps.ver.outputs.version }}-windows-home-setup.exe") {
            if (-not (Test-Path "dist\$n")) { throw "$n was not built" }
          }
      - name: The v0.2.0 installer (the last release), checked against its published checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory old | Out-Null
          $base = "https://github.com/tinytom21/lightcraft-cloud/releases/download/v0.2.0"
          Invoke-WebRequest "$base/lightcraft-cloud-0.2.0-windows-setup.exe" -OutFile old\lightcraft-cloud-0.2.0-windows-setup.exe
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile old\SHA256SUMS
          $want = ((Get-Content old\SHA256SUMS | Where-Object { $_ -match 'windows-setup.exe' }) -split '\s+')[0]
          $got = (Get-FileHash old\lightcraft-cloud-0.2.0-windows-setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "the v0.2.0 installer does not match its checksum: $want vs $got" }
          "v0.2.0 installer: $((Get-Item old\lightcraft-cloud-0.2.0-windows-setup.exe).Length) bytes, sha256 $got"
      - name: Test the light installer on Windows (install, run, update over a running copy, uninstall; the home one over it, and not the other way)
        shell: pwsh
        run: |
          $d = "dist\lightcraft-cloud-${{ steps.ver.outputs.version }}"
          ./packaging/windows/test-installer.ps1 -Setup (Resolve-Path "$d-windows-setup.exe").Path -Version "${{ steps.ver.outputs.version }}" -Variant light -OtherSetup (Resolve-Path "$d-windows-home-setup.exe").Path -OldSetup (Resolve-Path old\lightcraft-cloud-0.2.0-windows-setup.exe).Path
      - name: Test the home installer on Windows (the same; and the light one does not go over it)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $d = "dist\lightcraft-cloud-${{ steps.ver.outputs.version }}"
          ./packaging/windows/test-installer.ps1 -Setup (Resolve-Path "$d-windows-home-setup.exe").Path -Version "${{ steps.ver.outputs.version }}" -Variant home -OtherSetup (Resolve-Path "$d-windows-setup.exe").Path -OldSetup (Resolve-Path old\lightcraft-cloud-0.2.0-windows-setup.exe).Path
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: installer-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-windows
          path: |
            dist/lightcraft-cloud-${{ steps.ver.outputs.version }}-windows-setup.exe
            dist/lightcraft-cloud-${{ steps.ver.outputs.version }}-windows-home-setup.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    # the oldest Ubuntu runner, so that the programs run on older systems (the minimum glibc is printed below and in the release notes)
    name: Linux ${{ matrix.variant }}
    needs: librclone
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: light, cargo_flags: "--no-default-features" }
          - { variant: home, cargo_flags: "" }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: ver
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v$version (the version in Cargo.toml)"; exit 1
          fi
      - name: Rust toolchain (the version rust-toolchain.toml pins)
        run: |
          rustup toolchain install "$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)" --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: linux-release-${{ matrix.variant }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: librclone-linux
          path: out
      - name: Build (release)
        run: cargo build --release --locked -p lightcraft-cloud-desktop ${{ matrix.cargo_flags }}
      - name: The oldest glibc each file needs
        run: |
          for f in target/release/lightcraft-cloud-desktop out/librclone.so; do
            need=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$f needs $need"
            # (built on Ubuntu 22.04, glibc 2.35: nothing newer can be needed)
            [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35 ]
          done
          ldd target/release/lightcraft-cloud-desktop
      - name: Package
        run: |
          name=lightcraft-cloud-${{ steps.ver.outputs.version }}-linux-${{ matrix.variant }}
          mkdir -p "$name" dist
          cp target/release/lightcraft-cloud-desktop out/librclone.so "$name/"
          cp out/LICENSE-rclone.txt "$name/"
          cp LICENSE-MIT "$name/LICENSE-MIT.txt"
          cp LICENSE-APACHE "$name/LICENSE-APACHE.txt"
          cp apps/desktop/assets/fonts/OFL-Inter.txt "$name/LICENSE-Inter-OFL.txt"
          cp packaging/linux/install.sh "$name/install.sh"
          cp packaging/linux/lightcraft-cloud.png "$name/lightcraft-cloud.png"
          chmod 755 "$name/install.sh" "$name/lightcraft-cloud-desktop"
          tar --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
          ls -l dist; tar -tzvf "dist/$name.tar.gz"
      - name: Test install.sh (in a throwaway home folder) and the installed program
        run: |
          name=lightcraft-cloud-${{ steps.ver.outputs.version }}-linux-${{ matrix.variant }}
          t=$(mktemp -d); mkdir "$t/home" "$t/unpacked"
          tar -xzf "dist/$name.tar.gz" -C "$t/unpacked"
          HOME="$t/home" sh "$t/unpacked/$name/install.sh"
          test -x "$t/home/.local/bin/lightcraft-cloud-desktop"
          test -f "$t/home/.local/lib/lightcraft-cloud/librclone.so"
          test -f "$t/home/.local/lib/lightcraft-cloud/licenses/LICENSE-rclone.txt"
          test -f "$t/home/.local/lib/lightcraft-cloud/licenses/LICENSE-Inter-OFL.txt"
          grep -q '^Exec=".*/.local/bin/lightcraft-cloud-desktop" run$' "$t/home/.local/share/applications/io.github.tinytom21.lightcraftcloud.desktop"
          test -f "$t/home/.local/share/icons/hicolor/256x256/apps/io.github.tinytom21.lightcraftcloud.png"
          HOME="$t/home" "$t/home/.local/bin/lightcraft-cloud-desktop" --version | grep -q "lightcraft-cloud-desktop ${{ steps.ver.outputs.version }}"
          HOME="$t/home" "$t/home/.local/bin/lightcraft-cloud-desktop" --version | grep -q "edition: ${{ matrix.variant }}"
          "$t/home/.local/bin/lightcraft-cloud-desktop" --help | head -3
          # once more over the top: replaced, not an error
          HOME="$t/home" sh "$t/unpacked/$name/install.sh" >/dev/null
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-linux-${{ matrix.variant }}
          path: dist/lightcraft-cloud-${{ steps.ver.outputs.version }}-linux-${{ matrix.variant }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA256SUMS and the draft release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      # write only to create the draft release, and only on a tag (the steps below)
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum lightcraft-cloud-* > SHA256SUMS
          cat SHA256SUMS
          # both Windows installers and both Linux archives, and nothing else
          test "$(wc -l < SHA256SUMS)" = 4
          for k in windows-setup.exe windows-home-setup.exe linux-light.tar.gz linux-home.tar.gz; do grep -q -- "-$k\$" SHA256SUMS; done
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Draft release (a tag only; never published from here)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "LightCraft Cloud ${GITHUB_REF_NAME#v}" $pre
